          package com.novax.assistant

          import android.content.Context
          import android.content.SharedPreferences

          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(ctx: Context) {
                  sp = ctx.getSharedPreferences("novax_prefs", Context.MODE_PRIVATE)
              }

              private fun gs(k: String, d: String): String = sp.getString(k, d) ?: d
              private fun gb(k: String, d: Boolean): Boolean = sp.getBoolean(k, d)
              private fun ps(k: String, v: String) { sp.edit().putString(k, v).apply() }
              private fun pb(k: String, v: Boolean) { sp.edit().putBoolean(k, v).apply() }
              private fun pf(k: String, v: Float) { sp.edit().putFloat(k, v).apply() }

              var geminiKey: String
                  get() = gs("gemini_key", "").ifBlank { BuildConfig.GEMINI_API_KEY }
