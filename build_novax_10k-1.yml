      - name: Yaz app/src/main/java/com/novax/assistant/Screen.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Screen.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Araçların kullandığı, erişilebilirlik servisini güvenle saran ince katman. */
          object Screen {
              private const val NEED = "HATA: Erişilebilirlik servisi kapalı. Ayarlar > Erişilebilirlik > Novax'ı aç."

              private fun acc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              fun read(): String = acc()?.dump() ?: NEED

              fun describe(question: String): String {
                  val a = acc() ?: return NEED
                  val b64 = a.screenshotJpegBase64()
                  if (b64 == null) return "Ekran görüntüsü alınamadı (Android 11+ gerekir). Metin okuma: " + a.dump(2500)
                  return Gemini.describeImage(b64, question)
              }

              fun tapText(text: String, exact: Boolean): String {
                  val a = acc() ?: return NEED
                  return if (a.clickText(text, exact)) "Dokundum: $text" else "HATA: ekranda '$text' bulunamadı"
              }

              fun tapXY(x: Float, y: Float): String {
                  val a = acc() ?: return NEED
                  return if (a.tap(x, y)) "Dokundum ($x,$y)" else "HATA: dokunma başarısız"
              }

              fun swipe(dir: String): String {
                  val a = acc() ?: return NEED
                  return if (a.scroll(dir)) "Kaydırdım: $dir" else "HATA: kaydırılamadı ($dir)"
              }

              fun type(text: String, append: Boolean, enter: Boolean): String {
                  val a = acc() ?: return NEED
                  if (!a.typeText(text, append)) return "HATA: yazılabilir alan bulunamadı. Önce alana dokun."
                  if (enter) {
                      Thread.sleep(250)
                      a.pressEnter()
                  }
                  return "Yazdım" + (if (enter) " ve Enter'a bastım" else "")
              }

              fun key(k: String): String {
                  val a = acc() ?: return NEED
                  return if (a.global(k)) "Bastım: $k" else "HATA: tuş çalışmadı ($k)"
              }

              fun screenshotToFile(): String {
                  val a = acc() ?: return NEED
                  val f = a.screenshotFile() ?: return "HATA: ekran görüntüsü alınamadı"
                  return "Kaydedildi: " + f.absolutePath
              }

              fun waitFor(text: String, seconds: Int): String {
                  val a = acc() ?: return NEED
                  return if (a.waitForText(text, seconds.coerceIn(1, 40) * 1000L)) "Göründü: $text" else "Zaman aşımı: '$text' görünmedi"
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/SetupActivity.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/SetupActivity.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Activity
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          /** Kurulum & ayarlar: Gemini anahtarı, kişisel ayarlar, anahtarlar ve izin satırları. */
          class SetupActivity : Activity() {
              private lateinit var keyEt: EditText
              private lateinit var modelEt: EditText
              private lateinit var nameEt: EditText
              private lateinit var wakeEt: EditText
              private lateinit var ccEt: EditText
              private lateinit var langEt: EditText
              private lateinit var wakeCb: CheckBox
              private lateinit var ttsCb: CheckBox
              private lateinit var overlayCb: CheckBox
              private lateinit var testOut: TextView
              private lateinit var permBox: LinearLayout

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sv = ScrollView(this)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.fitsSystemWindows = true
                  col.setPadding(Ui.dp(this, 16f), Ui.dp(this, 8f), Ui.dp(this, 16f), Ui.dp(this, 32f))
                  sv.addView(col, ViewGroup.LayoutParams(-1, -2))
                  setContentView(sv)

                  col.addView(Ui.text(this, "KURULUM // AYARLAR", 20f, Ui.CYAN, true))

                  col.addView(Ui.section(this, "GEMINI"))
                  keyEt = Ui.edit(this, "API anahtarı (aistudio.google.com)", Prefs.geminiKey, true)
                  col.addView(keyEt, Ui.lp())
                  modelEt = Ui.edit(this, "Model", Prefs.model)
                  col.addView(modelEt, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 0f))
                  val testRow = LinearLayout(this)
                  testRow.addView(Ui.button(this, "Bağlantıyı test et", Ui.CYAN) { testKey() })
                  col.addView(testRow, Ui.margins(Ui.lp(), this, 0f, 8f, 0f, 0f))
                  testOut = Ui.text(this, "", 12f, Ui.CYAN_DIM)
                  col.addView(testOut, Ui.lp())

                  col.addView(Ui.section(this, "KİŞİSEL"))
                  nameEt = Ui.edit(this, "Sana ne diyeyim?", Prefs.userName)
                  col.addView(nameEt, Ui.lp())
                  wakeEt = Ui.edit(this, "Uyandırma kelimesi", Prefs.wakeWord)
                  col.addView(wakeEt, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 0f))
                  ccEt = Ui.edit(this, "Ülke kodu (Türkiye: 90)", Prefs.countryCode)
                  col.addView(ccEt, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 0f))
                  langEt = Ui.edit(this, "Dil (tr-TR, en-US)", Prefs.lang)
                  col.addView(langEt, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 0f))

                  col.addView(Ui.section(this, "DAVRANIŞ"))
                  wakeCb = makeCheck("Uyandırma kelimesiyle her zaman dinle", Prefs.wakeOn)
                  ttsCb = makeCheck("Sesli cevap ver", Prefs.ttsOn)
                  overlayCb = makeCheck("Yüzen orb göster (Üstte göster izni)", Prefs.overlayOn)
                  col.addView(wakeCb)
                  col.addView(ttsCb)
                  col.addView(overlayCb)

                  col.addView(Ui.section(this, "İZİNLER"))
                  permBox = LinearLayout(this)
                  permBox.orientation = LinearLayout.VERTICAL
                  col.addView(permBox, Ui.lp())

                  col.addView(Ui.button(this, "KAYDET VE BAŞLAT", Ui.GREEN) { save() },
                      Ui.margins(Ui.lp(), this, 0f, 20f, 0f, 0f))
                  col.addView(Ui.button(this, "Hafızayı temizle", Ui.RED) {
                      for (f in MemoryStore.recall("")) MemoryStore.forget(f.first)
                      MemoryStore.clearTurns()
                      Toast.makeText(this, "Hafıza temizlendi", Toast.LENGTH_SHORT).show()
                  }, Ui.margins(Ui.lp(), this, 0f, 10f, 0f, 0f))
              }

              override fun onResume() {
                  super.onResume()
                  renderPerms()
              }

              private fun makeCheck(label: String, on: Boolean): CheckBox {
                  val c = CheckBox(this)
                  c.text = label
                  c.isChecked = on
                  c.setTextColor(Ui.CYAN)
                  c.typeface = Ui.MONO
                  c.buttonTintList = android.content.res.ColorStateList.valueOf(Ui.CYAN)
                  return c
              }

              private fun renderPerms() {
                  permBox.removeAllViews()
                  for (item in Perms.items()) {
                      val granted = item.ok(this)
                      val row = Ui.panel(this)
                      val title = (if (granted) "✔ " else "✖ ") + item.title + (if (item.critical) "  (gerekli)" else "")
                      row.addView(Ui.text(this, title, 14f, if (granted) Ui.GREEN else Ui.AMBER, true))
                      row.addView(Ui.text(this, item.why, 11f, Ui.CYAN_DIM))
                      if (!granted) {
                          val btn = Ui.button(this, "İzin ver", Ui.AMBER) { item.ask(this) }
                          row.addView(btn, Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
                      }
                      permBox.addView(row, Ui.margins(Ui.lp(), this, 0f, 0f, 0f, 6f))
                  }
              }

              private fun persist() {
                  Prefs.geminiKey = keyEt.text.toString()
                  Prefs.model = modelEt.text.toString()
                  Prefs.userName = nameEt.text.toString()
                  Prefs.wakeWord = wakeEt.text.toString()
                  Prefs.countryCode = ccEt.text.toString()
                  Prefs.lang = langEt.text.toString().ifBlank { "tr-TR" }
                  Prefs.wakeOn = wakeCb.isChecked
                  Prefs.ttsOn = ttsCb.isChecked
                  Prefs.overlayOn = overlayCb.isChecked
                  Voice.init(this)
                  Voice.applyLanguage()
              }

              private fun testKey() {
                  persist()
                  testOut.text = "Test ediliyor…"
                  Thread {
                      val r = Gemini.test()
                      runOnUiThread { testOut.text = r }
                  }.start()
              }

              private fun save() {
                  persist()
                  if (Perms.micGranted(this)) {
                      if (NovaxService.running) NovaxService.stop(this)
                      NovaxService.start(this)
                  } else {
                      requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), Perms.REQ)
                      return
                  }
                  Toast.makeText(this, "Kaydedildi", Toast.LENGTH_SHORT).show()
                  finish()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  Contacts.invalidate()
                  renderPerms()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Text.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Text.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.util.Locale

          /** Metin yardımcıları: Türkçe-duyarlı normalizasyon, bulanık eşleşme, ek kırpma. */
          object Text {
              private val nonAlnum = Regex("[^a-z0-9 ]")
              private val spaces = Regex("\\s+")

              fun norm(s: String): String {
                  val sb = StringBuilder(s.length)
                  for (ch in s) sb.append(if (ch == 'İ' || ch == 'I' || ch == 'ı') 'i' else ch)
                  return sb.toString().lowercase(Locale.ROOT)
                      .replace('ş', 's').replace('ğ', 'g').replace('ü', 'u')
                      .replace('ö', 'o').replace('ç', 'c')
                      .replace(nonAlnum, " ")
                      .replace(spaces, " ").trim()
              }

              /** Komut metnini regex eşleşmesi için hazırlar: kesme işaretleri ve sondaki noktalama gider. */
              fun clean(s: String): String {
                  var t = s.trim().replace("'", "").replace("’", "").replace("`", "")
                  t = t.trimEnd('.', '!', '?', ',', ' ', ';')
                  t = t.replace(Regex("(?i)^(hey|ey|tamam)?\\s*novax\\s*[,.:]?\\s*"), "")
                  t = t.replace(Regex("(?i)\\s+(lütfen|lutfen|misin|mısın|musun|please)\\z"), "")
                  t = t.replace(Regex("(?i)^(lütfen|lutfen|please)\\s+"), "")
                  return t.trim()
              }

              fun lev(a: String, b: String): Int {
                  if (a == b) return 0
                  if (a.isEmpty()) return b.length
                  if (b.isEmpty()) return a.length
                  var prev = IntArray(b.length + 1) { it }
                  var cur = IntArray(b.length + 1)
                  for (i in 1..a.length) {
                      cur[0] = i
                      for (j in 1..b.length) {
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost)
                      }
                      val tmp = prev
                      prev = cur
                      cur = tmp
                  }
                  return prev[b.length]
              }

              /** "annemi" -> ["annemi","annem","anne","ann"]: Türkçe çekim eklerini kırparak aday üretir. */
              fun stems(word: String): List<String> {
                  val n = norm(word)
                  val out = ArrayList<String>()
                  if (n.isEmpty()) return out
                  out.add(n)
                  var i = 1
                  while (i <= 5 && n.length - i >= 3) {
                      out.add(n.dropLast(i))
                      i++
                  }
                  return out
              }

              fun clip(s: String, n: Int): String = if (s.length <= n) s else s.take(n) + "…"

              fun cap(s: String): String = if (s.isEmpty()) s else s.substring(0, 1).uppercase(Locale("tr")) + s.substring(1)
          }
          NOVAX_EOF

