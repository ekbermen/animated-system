      - name: Yaz app/src/main/java/com/novax/assistant/Voice.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Voice.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          /**
           * Ses motoru: uyandırma kelimesi döngüsü, tek seferlik komut dinleme ve TTS.
           * Her şey ana thread'de çalışır (SpeechRecognizer zorunluluğu).
           */
          object Voice : RecognitionListener {
              enum class Mode { OFF, WAKE, COMMAND }

              private lateinit var app: Context
              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var rec: SpeechRecognizer? = null
              private var inited = false
              private var afterSpeech: (() -> Unit)? = null
              private var errorStreak = 0

              @Volatile
              var mode: Mode = Mode.OFF

              @Volatile
              var speaking: Boolean = false

              fun init(ctx: Context) {
                  if (inited) return
                  inited = true
                  app = ctx.applicationContext
                  tts = TextToSpeech(app) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true
                          applyLanguage()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) {
                                  if (utteranceId != null && utteranceId.startsWith("last")) finishSpeech()
                              }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  finishSpeech()
                              }
                          })
                      } else {
                          Bus.log("TTS başlatılamadı")
                      }
                  }
              }

              fun applyLanguage() {
                  val loc = Locale.forLanguageTag(Prefs.lang)
                  val r = tts?.setLanguage(loc)
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) Bus.log("TTS dili desteklenmiyor: " + Prefs.lang)
                  tts?.setSpeechRate(Prefs.rate)
              }

              // ------------------------------------------------------------------ konuşma
              fun speak(text: String, then: (() -> Unit)? = null) {
                  val clean = text.replace(Regex("[*_`#>]"), "").replace(Regex("https?://\\S+"), "bağlantı").trim()
                  if (clean.isEmpty()) {
                      then?.invoke()
                      return
                  }
                  if (!Prefs.ttsOn || !ttsReady) {
                      Bus.setState(OrbState.IDLE)
                      then?.invoke()
                      main.post { resume() }
                      return
                  }
                  main.post {
                      destroyRec()
                      speaking = true
                      afterSpeech = then
                      Bus.setState(OrbState.SPEAKING)
                      val parts = splitForTts(clean)
                      for (i in parts.indices) {
                          val id = if (i == parts.lastIndex) "last$i" else "part$i"
                          val queueMode = if (i == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                          tts?.speak(parts[i], queueMode, null, id)
                      }
                  }
              }

              private fun splitForTts(s: String): List<String> {
                  val out = ArrayList<String>()
                  val sb = StringBuilder()
                  for (sentence in s.split(Regex("(?<=[.!?\\n])\\s+"))) {
                      if (sb.length + sentence.length > 1200 && sb.isNotEmpty()) {
                          out.add(sb.toString())
                          sb.setLength(0)
                      }
                      sb.append(sentence).append(' ')
                  }
                  if (sb.isNotBlank()) out.add(sb.toString().trim())
                  return if (out.isEmpty()) listOf(s) else out
              }

              private fun finishSpeech() {
                  main.post {
                      speaking = false
                      Bus.setState(OrbState.IDLE)
                      val cb = afterSpeech
                      afterSpeech = null
                      cb?.invoke()
                      resume()
                  }
              }

              fun stopSpeaking() {
                  main.post {
                      tts?.stop()
                      if (speaking) finishSpeech()
                  }
              }

              // ------------------------------------------------------------------ dinleme
              fun startWake() {
                  main.post {
                      if (mode != Mode.COMMAND) {
                          mode = Mode.WAKE
                          errorStreak = 0
                          startRec()
                      }
                  }
              }

              fun listenOnce() {
                  main.post {
                      tts?.stop()
                      speaking = false
                      afterSpeech = null
                      mode = Mode.COMMAND
                      errorStreak = 0
                      startRec()
                  }
              }

              fun stopAll() {
                  main.post {
                      mode = Mode.OFF
                      destroyRec()
                      Bus.setState(OrbState.IDLE)
                  }
              }

              private fun resume() {
                  if (mode == Mode.WAKE) main.postDelayed({ startRec() }, 350L)
              }

              private fun backToIdleMode() {
                  mode = if (Prefs.wakeOn && NovaxService.running) Mode.WAKE else Mode.OFF
              }

              private fun startRec() {
                  main.post {
                      if (speaking || mode == Mode.OFF) return@post
                      if (app.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          Bus.log("Mikrofon izni yok")
                          mode = Mode.OFF
                          return@post
                      }
                      if (!SpeechRecognizer.isRecognitionAvailable(app)) {
                          Bus.log("Cihazda konuşma tanıma servisi yok")
                          mode = Mode.OFF
                          return@post
                      }
                      destroyRec()
                      val r = SpeechRecognizer.createSpeechRecognizer(app)
                      r.setRecognitionListener(Voice)
                      rec = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Prefs.lang)
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, app.packageName)
                      try {
                          r.startListening(i)
                          Bus.setState(OrbState.LISTENING)
                      } catch (e: Exception) {
                          Bus.log("Dinleme başlatılamadı: " + e.message)
                          retry(1500L)
                      }
                  }
              }

              private fun destroyRec() {
                  try { rec?.cancel() } catch (_: Exception) {}
                  try { rec?.destroy() } catch (_: Exception) {}
                  rec = null
              }

              private fun retry(delay: Long) {
                  errorStreak++
                  val d = if (errorStreak > 5) 5000L else delay
                  main.postDelayed({
                      if (mode != Mode.OFF && !speaking) startRec()
                  }, d)
              }

              // ------------------------------------------------------------------ uyandırma kelimesi
              private fun wakeRegex(): Regex {
                  val w = Prefs.wakeWord.trim().lowercase()
                  val body = if (w == "novax" || w == "nova") "no+\\s?v[ae]+\\s?(?:x|ks|cks)?"
                  else Regex.escape(w).replace(" ", "\\s+")
                  return Regex("(?i)\\b" + body + "\\b")
              }

              private fun handleHeard(raw: String) {
                  val t = raw.trim()
                  if (t.isEmpty()) {
                      errorStreak = 0
                      if (mode == Mode.COMMAND) {
                          backToIdleMode()
                          Bus.setState(OrbState.IDLE)
                      }
                      resume()
                      return
                  }
                  errorStreak = 0
                  when (mode) {
                      Mode.COMMAND -> {
                          backToIdleMode()
                          Brain.handle(t)
                      }
                      Mode.WAKE -> {
                          val m = wakeRegex().find(t)
                          if (m == null) {
                              startRec()
                              return
                          }
                          val rest = t.substring(m.range.last + 1).trim().trimStart(',', '.', ':', ' ')
                          val before = t.substring(0, m.range.first).replace(Regex("(?i)\\b(hey|ey|tamam|merhaba|selam)\\b"), "").trim()
                          val cmd = if (rest.length >= 2) rest else before
                          if (cmd.length >= 2) {
                              Brain.handle(cmd)
                          } else {
                              mode = Mode.COMMAND
                              speak("Efendim?") { startRec() }
                          }
                      }
                      Mode.OFF -> {}
                  }
              }

              override fun onResults(results: Bundle?) {
                  val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  handleHeard(list?.firstOrNull() ?: "")
              }

              override fun onPartialResults(partialResults: Bundle?) {
                  val p = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: return
                  if (mode == Mode.COMMAND) Bus.partial(p)
              }

              override fun onError(error: Int) {
                  when (error) {
                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> {
                          mode = Mode.OFF
                          Bus.log("Mikrofon izni verilmemiş")
                          Bus.setState(OrbState.ERROR)
                      }
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> retry(1200L)
                      SpeechRecognizer.ERROR_CLIENT -> retry(600L)
                      SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                          if (mode == Mode.COMMAND) {
                              backToIdleMode()
                              Bus.setState(OrbState.IDLE)
                              Bus.partial("")
                              resume()
                          } else {
                              errorStreak = 0
                              retry(150L)
                          }
                      }
                      else -> retry(1500L)
                  }
              }

              override fun onRmsChanged(rmsdB: Float) { Bus.level(((rmsdB + 2f) / 12f).coerceIn(0f, 1f)) }
              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() { Bus.level(0f) }
              override fun onEvent(eventType: Int, params: Bundle?) {}
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/WaveView.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/WaveView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          /** Konuşma/dinleme sırasında hareket eden ses çubukları. */
          class WaveView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
              var level: Float = 0f
              private val dn = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bars = 36
              private val hs = FloatArray(bars)
              private var t = 0f
              private var last = 0L

              override fun onDraw(c: Canvas) {
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now
                  t += dt
                  val amp = when (state) {
                      OrbState.LISTENING -> 0.15f + level * 0.85f
                      OrbState.SPEAKING -> 0.55f
                      OrbState.THINKING -> 0.25f
                      OrbState.ERROR -> 0.1f
                      OrbState.IDLE -> 0.06f
                  }
                  val bw = width / bars.toFloat()
                  p.style = Paint.Style.FILL
                  p.color = when (state) {
                      OrbState.THINKING -> 0xFFFFB300.toInt()
                      OrbState.ERROR -> 0xFFFF3D3D.toInt()
                      else -> 0xFF00E5FF.toInt()
                  }
                  for (i in 0 until bars) {
                      val env = 0.35f + 0.65f * (1f - abs(i - bars / 2f) / (bars / 2f))
                      val v = abs(sin(t * 6f + i * 0.7f) * 0.6f + sin(t * 3.3f + i * 1.3f) * 0.4f)
                      hs[i] += (amp * env * v - hs[i]) * 0.3f
                      val bh = (height * (0.06f + hs[i] * 0.94f)).coerceAtLeast(2f * dn)
                      val x = i * bw + bw * 0.2f
                      c.drawRoundRect(x, (height - bh) / 2f, x + bw * 0.6f, (height + bh) / 2f, 2f * dn, 2f * dn, p)
                  }
                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Web.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Web.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.net.HttpURLConnection
          import java.net.URL

          object Web {
              fun fetchText(url: String, max: Int = 6000): String {
                  if (!url.startsWith("http")) return "HATA: geçersiz adres"
                  val c = URL(url).openConnection() as HttpURLConnection
                  try {
                      c.connectTimeout = 12000
                      c.readTimeout = 20000
                      c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) Novax/1.0")
                      c.instanceFollowRedirects = true
                      val code = c.responseCode
                      if (code !in 200..299) return "HATA: HTTP $code"
                      val raw = c.inputStream.bufferedReader().use { it.readText() }
                      val txt = raw.replace(Regex("(?is)<(script|style|noscript)[^>]*>.*?</\\1>"), " ")
                          .replace(Regex("(?s)<[^>]+>"), " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'")
                          .replace(Regex("\\s+"), " ").trim()
                      return Text.clip(txt, max)
                  } catch (e: Exception) {
                      return "HATA: " + e.message
                  } finally {
                      c.disconnect()
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/NovaxAdvancedCommands.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/NovaxAdvancedCommands.kt <<'NOVAX_EOF'
          package com.novax.assistant
          
          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.telephony.TelephonyManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.atomic.AtomicLong
          
          /**
           * Novax gelişmiş komut katmanı.
           *
           * Tasarım ilkeleri:
           * 1. Gerçekten yapılmayan bir işlem "yapıldı" diye raporlanmaz.
           * 2. PIN gibi Android'in uygulamaya vermediği gizli kimlik bilgileri okunmaya çalışılmaz.
           * 3. Play Store indirmeleri sessiz kurulum yerine resmi mağaza sayfasına yönlendirilir.
           * 4. Arka plan komutları yalnızca kullanıcı komuta @Arkaplan eklediğinde çalışır.
           * 5. WhatsApp gibi üçüncü taraf uygulamalarda UI otomasyonu erişilebilirlik servisi üzerinden
           *    yapılır; uygulamanın özel veritabanı veya şifreleri okunmaz.
           */
          object NovaxAdvancedCommands {
          
              private val seq = AtomicLong(0)
          
              fun tryHandle(input: String): String? {
                  val raw = input.trim()
                  if (raw.isEmpty()) return null
          
                  // Yeni sohbet
                  if (Regex("(?i)^(?:yeni sohbet|yeni konuşma|new chat|new conversation)$").matches(raw)) {
                      Bus.transcript.clear()
                      MemoryStore.clearTurns()
                      ActionAudit.log("NEW_CHAT", "Kullanıcı yeni sohbet başlattı")
                      return "Yeni sohbet açıldı."
                  }
          
                  // @Arkaplan yalnızca açıkça yazılırsa arka plan çalışır.
                  if (raw.startsWith("@Arkaplan", true)) {
                      val goal = raw.substringAfter("@Arkaplan", "").trim()
                      if (goal.isBlank()) return "Arka plan komutu boş."
                      ActionAudit.log("BACKGROUND_REQUEST", goal)
                      return Brain.background(goal)
                  }
          
                  // Canlı kamera / kameradan bana bak
                  if (Regex("(?i).*(live kamera|canlı kamera|kameradan bana bak|kamerayı aç|kameraya bak|video görüşme).*").matches(raw)) {
                      return CameraController.openLiveCamera()
                  }
          
                  // Ekran görüntüsü
                  if (Regex("(?i)^(?:take screenshot|screenshot al|ekran görüntüsü al|ekran goruntusu al|ekranımı çek|ekranimi cek)$").matches(raw)) {
                      return ScreenCapture.captureNow()
                  }
          
                  // Ekranı hızlı kontrol et
                  if (Regex("(?i).*(ekranı daha hızlı|ekrani daha hizli|hızlı ekran kontrolü|hizli ekran kontrolu).*").matches(raw)) {
                      return AccessibilityFastMode.enable()
                  }
          
                  // Telefon PIN'i: okunamaz; yalnızca güvenli durum bilgisi ver.
                  if (Regex("(?i).*(telefonun pini|telefon pinim|telefonun şifresi|telefon sifrem).*").matches(raw)) {
                      return DeviceSecurity.pinStatus()
                  }
          
                  // Telefon numarası
                  if (Regex("(?i).*(telefon numaram|numaram ne|kendi numaram).*").matches(raw)) {
                      return DeviceIdentity.phoneNumber()
                  }
          
                  // Klavye komutları
                  val typeMatch = Regex("(?i)^(?:klavyeyle|klavyeden|yaz)\\s+(.+)$").find(raw)
                  if (typeMatch != null) {
                      return KeyboardController.typeText(typeMatch.groupValues[1])
                  }
                  if (Regex("(?i)^(?:enter|giriş tuşuna bas|enter'a bas)$").matches(raw)) {
                      return KeyboardController.pressEnter()
                  }
                  if (Regex("(?i)^(?:geri tuşu|backspace|sil)$").matches(raw)) {
                      return KeyboardController.backspace()
                  }
          
                  // Sesli mesaj hazırlama / gönderme. Gerçek gönderim erişilebilirlik ile doğrulanır.
                  val voice = Regex("(?i)^(?:git\\s+)?whatsapp(?:'ta|da|dan)?\\s+(.+?)\\s+(?:adlı|adli)\\s+k[iı]ş[iı]ye\\s+(.+)$").find(raw)
                  if (voice != null) {
                      val contact = voice.groupValues[1].trim()
                      val message = voice.groupValues[2].trim()
                      return WhatsAppVoice.sendOrPrepare(contact, message)
                  }
          
                  // Görsel analiz: kullanıcı mevcut ekranı analiz etmek isterse.
                  if (Regex("(?i).*(ekrandaki fotoğrafı|ekrandaki fotonu|bu fotoğrafı|bu fotonu|görüntüyü analiz|goruntuyu analiz).*").matches(raw)) {
                      return MediaHub.analyzeCurrentScreen("Bu görüntüyü analiz et ve gördüğün önemli nesneleri Türkçe kısa anlat.")
                  }
          
                  // Sesli mesajı dinle: aktif uygulamada oynat düğmesini bulmaya çalış.
                  if (Regex("(?i).*(sesli mesajımı dinle|sesli mesajimi dinle|sesli mesajı oynat|sesli mesaji oynat).*").matches(raw)) {
                      return MediaHub.playVisibleVoiceMessage()
                  }
          
                  // Play Store / oyun indirme isteği
                  val dl = Regex("(?i)^(?:@?Arkaplan\\s+)?(?:play store'dan|play storedan|play storeden|google play'den|google playden)\\s+(.+?)\\s+(?:oyununu|uygulamasını|uygulamasini)\\s+indir$").find(raw)
                  if (dl != null) {
                      return StoreLauncher.openSearch(dl.groupValues[1].trim())
                  }
          
                  // Fakeden işlem yapma: doğrulama/gerçeklik durumu.
                  if (Regex("(?i).*(gerçekten yaptın mı|gercekten yaptin mi|uyduruyor musun|fake mi|sahte mi|yaptığını doğrula|yaptigini dogrula).*").matches(raw)) {
                      return ActionAudit.lastStatus()
                  }
          
                  return null
              }
          }
          
          /** Cihazın güvenlik durumunu bildirir; kilit PIN'ini hiçbir zaman okumaz. */
          object DeviceSecurity {
              fun pinStatus(): String {
                  val km = NovaxApp.instance.getSystemService(Context.KEYGUARD_SERVICE) as android.app.KeyguardManager
                  val secure = try { km.isKeyguardSecure } catch (_: Exception) { false }
                  return if (secure) {
                      "Telefonunda güvenli ekran kilidi var. Android uygulamalara PIN kodunu vermez; PIN'i okuyamam veya senin yerine devralamam."
                  } else {
                      "Telefonunda güvenli ekran kilidi görünmüyor. PIN kodu yine de uygulamaya okunabilir şekilde verilmez."
                  }
              }
          }
          
          /** Telefon numarasını yalnızca Android'in izin verdiği durumda okur. */
          object DeviceIdentity {
              fun phoneNumber(): String {
                  val c = NovaxApp.instance
                  if (Build.VERSION.SDK_INT >= 33 && c.checkSelfPermission(Manifest.permission.READ_PHONE_NUMBERS) != PackageManager.PERMISSION_GRANTED) {
                      return "Telefon numarası izni yok. Ayarlardan Telefon numarası iznini verirsen okuyabilirim."
                  }
                  return try {
                      val tm = c.getSystemService(Context.TELEPHONY_SERVICE) as TelephonyManager
                      val n = tm.line1Number?.trim().orEmpty()
                      if (n.isBlank()) "Operatör telefon numarasını Android'e vermiyor veya SIM numarası gizli." else "Telefon numaran: $n"
                  } catch (e: Exception) {
                      "Telefon numarasını okuyamadım: ${e.message ?: "izin veya operatör kısıtlaması"}"
                  }
              }
          }
          
          /** Play Store'a resmi arama açar; uygulama APK'sını sessizce indirip kurmaz. */
          object StoreLauncher {
              fun openSearch(query: String): String {
                  if (query.isBlank()) return "İndirilecek uygulama adı boş."
                  val q = Uri.encode(query)
                  val market = Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=$q")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val web = Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/search?q=$q&c=apps")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      NovaxApp.instance.startActivity(market)
                      ActionAudit.log("PLAY_STORE", "Arama açıldı: $query")
                      "Play Store'da $query için arama açıldı. Kurulum Android/Play Store tarafından yapılır; Novax sahte indirme sonucu göstermez."
                  } catch (_: Exception) {
                      try {
                          NovaxApp.instance.startActivity(web)
                          ActionAudit.log("PLAY_STORE_WEB", "Web araması açıldı: $query")
                          "Play Store uygulaması açılamadı; resmi Play Store web araması açıldı."
                      } catch (e: Exception) {
                          "Play Store açılamadı: ${e.message}"
                      }
                  }
              }
          }
          
          /** Erişilebilirlik servisini hızlandırmak için bekleme ve tarama ayarlarını tek yerde tutar. */
          object AccessibilityFastMode {
              @Volatile var enabled = true
                  private set
          
              fun enable(): String {
                  enabled = true
                  ActionAudit.log("FAST_ACCESSIBILITY", "Hızlı ekran modu etkin")
                  return if (NovaxAccessibilityService.connected) {
                      "Hızlı ekran kontrolü etkin. Ekran taramalarında görünür düğmeler önceliklendirilecek."
                  } else {
                      "Hızlı ekran modu hazır. Ekranı kontrol edebilmem için erişilebilirlik servisini aç."
                  }
              }
          
              fun shouldRetryQuickly(): Boolean = enabled
          }
          
          /** Yapılan ve doğrulanan eylemleri kaydeder; "yaptım" cevabı yerine gerçek durumu gösterir. */
          object ActionAudit {
              private const val MAX = 80
              private val events = java.util.concurrent.CopyOnWriteArrayList<String>()
          
              fun log(kind: String, detail: String) {
                  val stamp = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  events.add("$stamp | $kind | ${detail.take(500)}")
                  while (events.size > MAX) events.removeAt(0)
              }
          
              fun lastStatus(): String {
                  val last = events.lastOrNull()
                  return if (last == null) "Henüz doğrulanmış eylem kaydı yok." else "Son eylem kaydı: $last"
              }
          
              fun snapshot(): List<String> = events.toList()
          
              fun id(): Long = seq.incrementAndGet()
          }
          
          /**
           * Kamera açma yöneticisi.
           * Gerçek kamera ekranı CameraActivity'dedir; bu sınıf yalnızca UI'yi açar.
           */
          object CameraController {
              fun openLiveCamera(): String {
                  val i = Intent(NovaxApp.instance, CameraActivity::class.java)
                  i.putExtra("mode", "live")
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  return try {
                      NovaxApp.instance.startActivity(i)
                      ActionAudit.log("CAMERA_OPEN", "Live kamera ekranı açıldı")
                      "Live kamera açıldı. Kameradan gelen görüntüyü uygulama içinde analiz edebilirim."
                  } catch (e: Exception) {
                      "Kamera ekranı açılamadı: ${e.message}"
                  }
              }
          }
          
          /** WhatsApp sesli mesaj akışı. Ses dosyasını hazırlayıp resmi paylaşım/uygulama UI'sına bırakır. */
          object WhatsAppVoice {
              fun sendOrPrepare(contact: String, text: String): String {
                  if (!NovaxAccessibilityService.connected) {
                      val launch = Apps.openByName("WhatsApp")
                      ActionAudit.log("WHATSAPP_PREPARE", "$contact: $text")
                      return "$launch Erişilebilirlik servisi kapalı olduğu için kişiyi ve sesli mesajı otomatik gönderemedim. Mesajı hazırlamak için erişilebilirliği aç."
                  }
          
                  val prepared = MediaHub.synthesizeVoice(text)
                  if (!prepared) return "Sesli mesaj için ses kaydı hazırlanamadı."
                  val opened = Apps.openByName("WhatsApp")
                  ActionAudit.log("WHATSAPP_OPEN", "$contact: $text")
                  return if (opened.contains("açıldı") || opened.contains("başlatıldı")) {
                      "WhatsApp açıldı. $contact kişisine gönderilecek sesli mesaj hazırlandı. Gönderme adımını ekrandan doğrulayıp tamamlamaya çalışabilirim."
                  } else {
                      "WhatsApp açılamadı; sesli mesaj hazırlanmış olabilir, ancak gönderildiğini doğrulamıyorum."
                  }
              }
          }
          
          /** Klavye yerine erişilebilirlik text input kullanır; Android güvenlik modeli dışına çıkmaz. */
          object KeyboardController {
              fun typeText(text: String): String {
                  if (text.isBlank()) return "Yazılacak metin boş."
                  val s = NovaxAccessibilityService.instance ?: return "Klavye kontrolü için erişilebilirlik servisini aç."
                  val ok = s.typeText(text)
                  ActionAudit.log("TYPE_TEXT", "len=${text.length}, ok=$ok")
                  return if (ok) "Metin yazıldı." else "Aktif metin alanına yazılamadı."
              }
          
              fun pressEnter(): String {
                  val s = NovaxAccessibilityService.instance ?: return "Erişilebilirlik servisini aç."
                  val ok = s.pressKey(android.view.KeyEvent.KEYCODE_ENTER)
                  ActionAudit.log("KEY_ENTER", "ok=$ok")
                  return if (ok) "Enter gönderildi." else "Enter gönderilemedi."
              }
          
              fun backspace(): String {
                  val s = NovaxAccessibilityService.instance ?: return "Erişilebilirlik servisini aç."
                  val ok = s.pressKey(android.view.KeyEvent.KEYCODE_DEL)
                  ActionAudit.log("KEY_BACKSPACE", "ok=$ok")
                  return if (ok) "Silme tuşu gönderildi." else "Silme tuşu gönderilemedi."
              }
          }
          
          /**
           * Uzun açıklama ve gelecekteki özelliklerin tek yerde tutulduğu politika.
           * Bu bölüm özellikle otomasyonun sınırlarını netleştirir.
           */
          object NovaxSafetyPolicy {
              val rules = listOf(
                  "PIN, şifre, biyometrik sır veya güvenlik kodu okunmaz.",
                  "Para transferi, satın alma, hesap silme ve toplu mesajlarda onay gerekir.",
                  "Üçüncü taraf uygulamanın özel veritabanı okunmaz.",
                  "Play Store kurulum sonucu doğrulanmadan başarılı sayılmaz.",
                  "Kamera kullanıcı açıkça kamera komutu verdiğinde açılır.",
                  "@Arkaplan yoksa arka plan görevi kendiliğinden başlatılmaz.",
                  "Gerçekleşmeyen eylem başarılı olarak raporlanmaz.",
                  "Kullanıcının ekranı ve mikrofonu yalnızca gerekli Android izinleriyle kullanılır.",
                  "Erişilebilirlik servisi kapalıysa ekran kontrolü yapılmaz.",
                  "Model/API testi başarısızsa model çalışıyor gibi gösterilmez."
              )
          
              fun asText(): String = rules.mapIndexed { i, r -> "${i + 1}. $r" }.joinToString("\n")
          }
          
          /*
           * Aşağıdaki sabitler, doğal dil komutlarının gelecekteki sürümler arasında
           * tutarlı kalması için merkezi sözlük görevi görür.
           */
          object NovaxCommandVocabulary {
              val camera = listOf(
                  "live kamera", "canlı kamera", "kameradan bana bak", "kamerayı aç",
                  "kameraya bak", "video görüşme", "kamerayı başlat", "kamera modu"
              )
              val background = listOf(
                  "@Arkaplan", "@arka plan", "arka plan görevi", "background"
              )
              val screenshot = listOf(
                  "take screenshot", "screenshot al", "ekran görüntüsü al",
                  "ekranımı çek", "ekran görüntüsünü al", "screen capture"
              )
              val keyboard = listOf(
                  "klavyeyle yaz", "klavyeden yaz", "metni yaz", "enter",
                  "geri tuşu", "backspace", "sil"
              )
              val verification = listOf(
                  "gerçekten yaptın mı", "yaptın mı", "doğrula", "fake mi",
                  "sahte mi", "uyduruyor musun"
              )
              val chat = listOf(
                  "yeni sohbet", "yeni konuşma", "new chat", "new conversation"
              )
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/CameraActivity.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/CameraActivity.kt <<'NOVAX_EOF'
          package com.novax.assistant
          
          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.ImageFormat
          import android.graphics.SurfaceTexture
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CaptureRequest
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.media.ImageReader
          import android.os.Bundle
          import android.os.Handler
          import android.os.HandlerThread
          import android.view.Gravity
          import android.view.Surface
          import android.view.TextureView
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.atomic.AtomicBoolean
          
          /**
           * Novax Live Kamera.
           *
           * - Camera2 ile gerçek zamanlı önizleme.
           * - Periyodik JPEG frame yakalama.
           * - Gemini.describeImage ile isteğe bağlı görsel analiz.
           * - Kullanıcı ekranı kapatınca kamera kapatılır.
           * - Kamera servisi arka planda gizlice çalışmaz.
           */
          class CameraActivity : Activity() {
          
              private lateinit var texture: TextureView
              private lateinit var status: TextView
              private lateinit var capture: Button
              private var camera: CameraDevice? = null
              private var session: CameraCaptureSession? = null
              private var reader: ImageReader? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null
              private var cameraId: String? = null
              private val closing = AtomicBoolean(false)
              private var lastFrame: ByteArray? = null
              private var liveAi = true
              private var lastSpokenVision = ""
              private val liveLoop = object : Runnable {
                  override fun run() {
                      if (!isFinishing && liveAi && lastFrame != null) analyzeLiveFrame()
                      handler?.postDelayed(this, 4500L)
                  }
              }
          
              private val listener = object : TextureView.SurfaceTextureListener {
                  override fun onSurfaceTextureAvailable(st: SurfaceTexture, w: Int, h: Int) {
                      openCamera()
                  }
                  override fun onSurfaceTextureSizeChanged(st: SurfaceTexture, w: Int, h: Int) {}
                  override fun onSurfaceTextureDestroyed(st: SurfaceTexture): Boolean {
                      closeCamera()
                      return true
                  }
                  override fun onSurfaceTextureUpdated(st: SurfaceTexture) {}
              }
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(buildUi())
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.CAMERA), 410)
                  } else {
                      startCameraThread()
                      texture.surfaceTextureListener = listener
                  }
              }
          
              private fun buildUi(): FrameLayout {
                  val root = FrameLayout(this)
                  root.setBackgroundColor(0xFF02070D.toInt())
          
                  texture = TextureView(this)
                  root.addView(texture, FrameLayout.LayoutParams(-1, -1))
          
                  val top = FrameLayout(this)
                  top.setPadding(18, 18, 18, 18)
                  status = TextView(this)
                  status.text = "NOVAX LIVE CAMERA\nKamera hazırlanıyor…"
                  status.setTextColor(0xFF00E5FF.toInt())
                  status.textSize = 14f
                  top.addView(status)
          
                  val close = Button(this)
                  close.text = "Kapat"
                  close.setOnClickListener { finish() }
                  val cp = FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END)
                  cp.setMargins(0, 12, 12, 0)
                  root.addView(close, cp)
          
                  capture = Button(this)
                  capture.text = "Görüntüyü analiz et"
                  capture.setOnClickListener { analyzeLastFrame() }
                  val bp = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                  bp.setMargins(12, 12, 12, 28)
                  root.addView(capture, bp)
          
                  val live = Button(this)
                  live.text = "Live AI: AÇIK"
                  live.setOnClickListener {
                      liveAi = !liveAi
                      live.text = if (liveAi) "Live AI: AÇIK" else "Live AI: KAPALI"
                      if (liveAi) handler?.post(liveLoop)
                  }
                  val lp = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.END)
                  lp.setMargins(8, 8, 12, 28)
                  root.addView(live, lp)
          
                  root.addView(top, FrameLayout.LayoutParams(-1, -2))
                  return root
              }
          
              private fun startCameraThread() {
                  thread = HandlerThread("NovaxCamera")
                  thread!!.start()
                  handler = Handler(thread!!.looper)
              }
          
              private fun openCamera() {
                  val cm = getSystemService(CAMERA_SERVICE) as CameraManager
                  try {
                      cameraId = cm.cameraIdList.firstOrNull { id ->
                          val c = cm.getCameraCharacteristics(id)
                          c.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT
                      } ?: cm.cameraIdList.firstOrNull()
          
                      val id = cameraId ?: run {
                          status.text = "Kamera bulunamadı."
                          return
                      }
          
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          status.text = "Kamera izni verilmedi."
                          return
                      }
          
                      cm.openCamera(id, object : CameraDevice.StateCallback() {
                          override fun onOpened(cd: CameraDevice) {
                              camera = cd
                              status.text = "NOVAX LIVE CAMERA\nCanlı görüntü aktif"
                              createSession(cd)
                          }
          
                          override fun onDisconnected(cd: CameraDevice) {
                              cd.close()
                              camera = null
                              status.text = "Kamera bağlantısı kesildi."
                          }
          
                          override fun onError(cd: CameraDevice, error: Int) {
                              cd.close()
                              camera = null
                              status.text = "Kamera hatası: $error"
                          }
                      }, handler)
                  } catch (e: Exception) {
                      status.text = "Kamera açılamadı: ${e.message}"
                  }
              }
          
              private fun createSession(cd: CameraDevice) {
                  val st = texture.surfaceTexture ?: return
                  st.setDefaultBufferSize(texture.width.coerceAtLeast(640), texture.height.coerceAtLeast(480))
                  val preview = Surface(st)
          
                  reader = ImageReader.newInstance(640, 480, ImageFormat.JPEG, 2)
                  reader!!.setOnImageAvailableListener({ r ->
                      val image = try { r.acquireLatestImage() } catch (_: Exception) { null }
                      if (image != null) {
                          try {
                              val plane = image.planes.firstOrNull()
                              if (plane != null) {
                                  val bytes = ByteArray(plane.buffer.remaining())
                                  plane.buffer.get(bytes)
                                  lastFrame = bytes
                              }
                          } finally {
                              image.close()
                          }
                      }
                  }, handler)
          
                  try {
                      cd.createCaptureSession(
                          listOf(preview, reader!!.surface),
                          object : CameraCaptureSession.StateCallback() {
                              override fun onConfigured(s: CameraCaptureSession) {
                                  session = s
                                  val req = cd.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                                  req.addTarget(preview)
                                  req.addTarget(reader!!.surface)
                                  req.set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                                  s.setRepeatingRequest(req.build(), null, handler)
                                  handler?.postDelayed(liveLoop, 1800L)
                              }
          
                              override fun onConfigureFailed(s: CameraCaptureSession) {
                                  status.text = "Kamera oturumu başlatılamadı."
                              }
                          },
                          handler
                      )
                  } catch (e: Exception) {
                      status.text = "Kamera oturumu hatası: ${e.message}"
                  }
              }
          
              private fun analyzeLiveFrame() {
                  val frame = lastFrame ?: return
                  if (!capture.isEnabled) return
                  capture.isEnabled = false
                  Thread {
                      val result = try {
                          val b64 = android.util.Base64.encodeToString(frame, android.util.Base64.NO_WRAP)
                          Gemini.describeImage(
                              b64,
                              "Bu canlı kamera karesini analiz et. Kullanıcıyla görüntülü konuşuyormuşsun gibi yalnızca önemli yeni gözlemi Türkçe, en fazla iki kısa cümleyle anlat. Emin olmadığın şeyi kesin söyleme."
                          )
                      } catch (e: Exception) {
                          "Canlı görüntü analizi başarısız: ${e.message}"
                      }
                      runOnUiThread {
                          capture.isEnabled = true
                          status.text = "NOVAX LIVE CAMERA\n$result"
                          if (result.isNotBlank() && !result.startsWith("Canlı görüntü analizi başarısız")) {
                              Bus.novax(result)
                              if (Prefs.ttsOn && result != lastSpokenVision && result.length < 240) {
                                  lastSpokenVision = result
                                  Voice.speak(result)
                              }
                          }
                          ActionAudit.log("LIVE_VISION", result)
                      }
                  }.start()
              }
          
              private fun analyzeLastFrame() {
                  val frame = lastFrame ?: run {
                      status.text = "Henüz görüntü karesi alınmadı."
                      return
                  }
                  status.text = "NOVAX LIVE CAMERA\nGörüntü analiz ediliyor…"
                  capture.isEnabled = false
                  Thread {
                      val result = try {
                          val b64 = android.util.Base64.encodeToString(frame, android.util.Base64.NO_WRAP)
                          Gemini.describeImage(b64, "Kameranın bu karesinde ne görüyorsun? Kısa ve Türkçe anlat.")
                      } catch (e: Exception) {
                          "Görüntü analiz edilemedi: ${e.message}"
                      }
                      runOnUiThread {
                          capture.isEnabled = true
                          status.text = "NOVAX LIVE CAMERA\n$result"
                          Bus.novax(result)
                          ActionAudit.log("CAMERA_ANALYZE", result)
                      }
                  }.start()
              }
          
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<String>, results: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, results)
                  if (requestCode == 410 && results.firstOrNull() == PackageManager.PERMISSION_GRANTED) {
                      startCameraThread()
                      texture.surfaceTextureListener = listener
                  } else {
                      status.text = "Kamera izni verilmedi."
                  }
              }
          
              private fun closeCamera() {
                  if (!closing.compareAndSet(false, true)) return
                  try { session?.close() } catch (_: Exception) {}
                  try { camera?.close() } catch (_: Exception) {}
                  try { reader?.close() } catch (_: Exception) {}
                  session = null
                  camera = null
                  reader = null
                  try { handler?.removeCallbacks(liveLoop) } catch (_: Exception) {}
                  try { thread?.quitSafely() } catch (_: Exception) {}
                  thread = null
                  handler = null
                  closing.set(false)
                  ActionAudit.log("CAMERA_CLOSE", "Kamera kapatıldı")
              }
          
              override fun onDestroy() {
                  closeCamera()
                  super.onDestroy()
              }
          }
          
          /*
           * Kamera API isimlerinin tek dosyada açık tutulması, Android sürümleri arasında
           * hata ayıklamayı kolaylaştırır. Camera2'nin eski cihaz davranışları için aşağıdaki
           * yardımcı tanımlar yalnızca açıklama amaçlıdır ve çalışma zamanında özel yetki
           * yükseltmesi yapmaz.
           */
          private object CameraNotes {
              const val PREVIEW = "preview"
              const val ANALYSIS = "analysis"
              const val FRONT = "front"
              const val USER_INITIATED = "user_initiated"
          }
          NOVAX_EOF

