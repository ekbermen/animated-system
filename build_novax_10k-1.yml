          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          /** Ana Jarvis ekranı: reaktör, dalga, sohbet akışı, hızlı komutlar, yazı + mikrofon girişi. */
          class MainActivity : Activity(), Bus.Listener {
              private lateinit var reactor: JarvisReactorView
              private lateinit var wave: WaveView
              private lateinit var statusLabel: TextView
              private lateinit var partialLabel: TextView
              private lateinit var feed: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var banner: LinearLayout
              private lateinit var micBtn: TextView
              private lateinit var dot: View

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Voice.init(this)
                  setContentView(buildUi())
                  for (item in Bus.transcript) addBubble(item.first == "user", item.second)
                  if (Bus.transcript.isEmpty()) addBubble(false, "Sistemler çevrimiçi. Beni \"" + Prefs.wakeWord + "\" diyerek çağır ya da yaz.")
                  applyState(Bus.current)
              }

              override fun onResume() {
                  super.onResume()
                  Bus.add(this)
                  refreshBanner()
                  if (Perms.micGranted(this) && Prefs.wakeOn && !NovaxService.running) NovaxService.start(this)
              }

              override fun onPause() {
                  super.onPause()
                  Bus.remove(this)
              }

              // ------------------------------------------------------------------ UI
              private fun buildUi(): View {
                  val root = FrameLayout(this)
                  root.addView(HudBackgroundView(this), FrameLayout.LayoutParams(-1, -1))

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.fitsSystemWindows = true
                  col.setPadding(Ui.dp(this, 14f), Ui.dp(this, 6f), Ui.dp(this, 14f), Ui.dp(this, 8f))
                  root.addView(col, FrameLayout.LayoutParams(-1, -1))

                  // üst çubuk
                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL
                  val titles = LinearLayout(this)
                  titles.orientation = LinearLayout.VERTICAL
                  val title = Ui.text(this, "N O V A X", 22f, Ui.CYAN, true)
                  titles.addView(title)
                  titles.addView(Ui.text(this, "NEURAL ASSISTANT // v1.0", 10f, Ui.CYAN_DIM))
                  top.addView(titles, Ui.lp(0, -2, 1f))
                  dot = View(this)
                  dot.background = Ui.box(this, Ui.CYAN, Ui.CYAN, 20f, 0f)
                  top.addView(dot, Ui.margins(Ui.lp(Ui.dp(this, 9f), Ui.dp(this, 9f)), this, 0f, 0f, 8f, 0f))
                  val gear = Ui.button(this, "⚙", Ui.CYAN) { startActivity(Intent(this, SetupActivity::class.java)) }
                  top.addView(gear)
                  col.addView(top, Ui.lp())

                  // uyarı bandı
                  banner = Ui.panel(this)
                  banner.background = Ui.box(this, Color.parseColor("#2A1A00"), Ui.AMBER, 8f)
                  col.addView(banner, Ui.margins(Ui.lp(), this, 0f, 8f, 0f, 0f))

                  // reaktör
                  val rf = FrameLayout(this)
                  reactor = JarvisReactorView(this)
                  rf.addView(reactor, FrameLayout.LayoutParams(-1, -1))
                  reactor.setOnClickListener { onMic() }
                  statusLabel = Ui.text(this, "STANDBY", 12f, Ui.CYAN, true)
                  statusLabel.letterSpacing = 0.3f
                  val sl = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                  rf.addView(statusLabel, sl)
                  col.addView(rf, Ui.lp(-1, 0, 1.05f))

                  wave = WaveView(this)
                  col.addView(wave, Ui.lp(-1, Ui.dp(this, 34f)))

                  partialLabel = Ui.text(this, "", 13f, Ui.CYAN_DIM)
                  partialLabel.gravity = Gravity.CENTER
                  partialLabel.minHeight = Ui.dp(this, 20f)
                  col.addView(partialLabel, Ui.lp())

                  // sohbet akışı
                  scroll = ScrollView(this)
                  scroll.isVerticalScrollBarEnabled = false
                  feed = LinearLayout(this)
                  feed.orientation = LinearLayout.VERTICAL
                  scroll.addView(feed, FrameLayout.LayoutParams(-1, -2))
                  col.addView(scroll, Ui.lp(-1, 0, 1f))

                  // hızlı komutlar
                  val chips = LinearLayout(this)
                  val chipScroll = HorizontalScrollView(this)
                  chipScroll.isHorizontalScrollBarEnabled = false
                  val chipList = listOf(
                      "🕒 Saat" to "saat kaç", "🔋 Pil" to "pil durumu", "👁 Ekranı oku" to "ekranda ne var",
                      "🔦 Fener" to "feneri aç", "🌤 Hava" to "hava durumu", "📰 Haber" to "son dakika haberler",
                      "📝 Notlarım" to "notlarım", "🧠 Hafıza" to "ne hatırlıyorsun", "⚙ Neler yaparsın" to "neler yapabilirsin"
                  )
                  for (chip in chipList) {
                      val cmd = chip.second
                      val c = Ui.button(this, chip.first, Ui.CYAN_DIM) { Brain.handle(cmd) }
                      chips.addView(c, Ui.margins(Ui.lp(-2, -2), this, 0f, 0f, 6f, 0f))
                  }
                  chipScroll.addView(chips)
                  col.addView(chipScroll, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 6f))

                  // giriş satırı
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  input = Ui.edit(this, "Komut yaz…")
                  input.imeOptions = EditorInfo.IME_ACTION_SEND
                  input.setOnEditorActionListener { _, id, ev ->
                      val enter = ev != null && ev.keyCode == KeyEvent.KEYCODE_ENTER && ev.action == KeyEvent.ACTION_DOWN
                      if (id == EditorInfo.IME_ACTION_SEND || enter) {
                          send()
                          true
                      } else {
                          false
                      }
                  }
                  row.addView(input, Ui.lp(0, -2, 1f))
                  val sendBtn = Ui.button(this, "➤", Ui.CYAN) { send() }
                  row.addView(sendBtn, Ui.margins(Ui.lp(-2, -2), this, 6f, 0f, 0f, 0f))
                  micBtn = Ui.text(this, "🎙", 22f, Ui.CYAN)
                  micBtn.gravity = Gravity.CENTER
                  micBtn.background = Ui.box(this, Color.parseColor("#0B2233"), Ui.CYAN, 30f, 1.5f)
                  micBtn.setOnClickListener { onMic() }
                  row.addView(micBtn, Ui.margins(Ui.lp(Ui.dp(this, 52f), Ui.dp(this, 52f)), this, 8f, 0f, 0f, 0f))
                  col.addView(row, Ui.lp())
                  return root
              }

              private fun refreshBanner() {
                  banner.removeAllViews()
                  val miss = Perms.missingCritical(this)
                  if (miss.isEmpty() && Prefs.geminiKey.isNotBlank()) {
                      banner.visibility = View.GONE
                      return
                  }
                  banner.visibility = View.VISIBLE
                  val lines = ArrayList<String>()
                  if (Prefs.geminiKey.isBlank()) lines.add("• Gemini API anahtarı yok")
                  for (m in miss) lines.add("• " + m.title + " izni gerekli")
                  banner.addView(Ui.text(this, "KURULUM EKSİK\n" + lines.joinToString("\n"), 12f, Ui.AMBER))
                  val go = Ui.button(this, "Kuruluma git", Ui.AMBER) { startActivity(Intent(this, SetupActivity::class.java)) }
                  banner.addView(go, Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
              }

              private fun send() {
                  val t = input.text.toString().trim()
                  if (t.isEmpty()) return
                  input.setText("")
                  (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(input.windowToken, 0)
                  Voice.stopSpeaking()
                  Brain.handle(t)
              }

              private fun onMic() {
                  if (!Perms.micGranted(this)) {
                      requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), Perms.REQ)
                      return
                  }
                  if (Voice.speaking) { Voice.stopSpeaking(); return }
                  if (Voice.mode == Voice.Mode.COMMAND) {
                      Voice.stopAll()
                      if (Prefs.wakeOn) Voice.startWake()
                      return
                  }
                  Voice.listenOnce()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  refreshBanner()
                  if (Perms.micGranted(this) && !NovaxService.running) NovaxService.start(this)
              }

              private fun addBubble(user: Boolean, text: String) {
                  val tv = Ui.text(this, (if (user) "› " else "◈ ") + text, 14f, if (user) Color.WHITE else Ui.CYAN)
                  tv.setTextIsSelectable(true)
                  val fill = if (user) Color.parseColor("#12384D") else Color.parseColor("#0A1B2A")
                  val stroke = if (user) Ui.CYAN_DIM else Color.parseColor("#33005F73")
                  tv.background = Ui.box(this, fill, stroke, 10f)
                  tv.setPadding(Ui.dp(this, 12f), Ui.dp(this, 8f), Ui.dp(this, 12f), Ui.dp(this, 8f))
                  val lp = Ui.margins(Ui.lp(-2, -2), this, if (user) 40f else 0f, 3f, if (user) 0f else 40f, 3f)
                  lp.gravity = if (user) Gravity.END else Gravity.START
                  feed.addView(tv, lp)
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun applyState(s: OrbState) {
                  reactor.state = s
                  wave.state = s
                  val label: String
                  val color: Int
                  when (s) {
                      OrbState.IDLE -> {
                          label = if (NovaxService.running && Prefs.wakeOn) "DİNLİYOR · \"" + Prefs.wakeWord.uppercase() + "\"" else "STANDBY"
                          color = Ui.CYAN_DIM
                      }
                      OrbState.LISTENING -> { label = "LISTENING"; color = Ui.CYAN }
                      OrbState.THINKING -> { label = "PROCESSING"; color = Ui.AMBER }
                      OrbState.SPEAKING -> { label = "SPEAKING"; color = Ui.CYAN }
                      OrbState.ERROR -> { label = "ERROR"; color = Ui.RED }
                  }
                  statusLabel.text = label
                  statusLabel.setTextColor(color)
                  dot.background = Ui.box(this, color, color, 20f, 0f)
              }

              // ------------------------------------------------------------------ Bus
              override fun onUser(text: String) { addBubble(true, text); partialLabel.text = "" }
              override fun onNovax(text: String) { addBubble(false, text) }
              override fun onState(s: OrbState) { applyState(s) }
              override fun onLevel(v: Float) { reactor.level = v; wave.level = v }
              override fun onPartial(text: String) { partialLabel.text = text }
              override fun onLog(line: String) { partialLabel.text = Text.clip(line, 60) }
          }
