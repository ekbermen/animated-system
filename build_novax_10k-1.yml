           */
          object MediaBehaviorMatrix {
              val photo = listOf("analyze", "share", "open")
              val video = listOf("analyze", "share", "open")
              val audio = listOf("play_visible", "share", "open")
              val protected = listOf("never_read_private_db", "never_bypass_permission")
          }
