                  "ayarlar" to listOf("com.android.settings"), "ayar" to listOf("com.android.settings"), "settings" to listOf("com.android.settings"),
                  "hesap makinesi" to listOf("com.google.android.calculator", "com.sec.android.app.popupcalculator", "com.miui.calculator", "com.android.calculator2"),
                  "hesap makinasi" to listOf("com.google.android.calculator", "com.sec.android.app.popupcalculator"),
                  "saat" to listOf("com.google.android.deskclock", "com.sec.android.app.clockpackage", "com.android.deskclock"),
                  "alarm" to listOf("com.google.android.deskclock", "com.sec.android.app.clockpackage"),
                  "takvim" to listOf("com.google.android.calendar", "com.samsung.android.calendar"), "calendar" to listOf("com.google.android.calendar"),
                  "rehber" to listOf("com.google.android.contacts", "com.samsung.android.app.contacts", "com.android.contacts"),
                  "kisiler" to listOf("com.google.android.contacts", "com.samsung.android.contacts", "com.android.contacts"),
                  "telefon" to listOf("com.google.android.dialer", "com.samsung.android.dialer", "com.android.dialer"),
                  "mesajlar" to listOf("com.google.android.apps.messaging", "com.samsung.android.messaging"), "sms" to listOf("com.google.android.apps.messaging"),
                  "dosyalar" to listOf("com.google.android.apps.nbu.files", "com.sec.android.app.myfiles", "com.android.documentsui"),
                  "dosya yoneticisi" to listOf("com.google.android.apps.nbu.files", "com.sec.android.app.myfiles"),
                  "notlar" to listOf("com.google.android.keep", "com.samsung.android.app.notes", "com.miui.notes", "com.google.android.apps.notes"),
                  "not defteri" to listOf("com.google.android.keep", "com.samsung.android.app.notes", "com.miui.notes"),
                  "keep" to listOf("com.google.android.keep"), "drive" to listOf("com.google.android.apps.docs"),
                  "google" to listOf("com.google.android.googlequicksearchbox"), "asistan" to listOf("com.google.android.googlequicksearchbox"),
                  "translate" to listOf("com.google.android.apps.translate"), "ceviri" to listOf("com.google.android.apps.translate"),
                  "trendyol" to listOf("com.trendyol.android"), "hepsiburada" to listOf("com.pozitron.hepsiburada"),
                  "yemeksepeti" to listOf("com.inovel.app.yemeksepeti"), "getir" to listOf("com.getir"), "uber" to listOf("com.ubercab"),
                  "bitaksi" to listOf("com.bitaksi.passenger"), "e devlet" to listOf("tr.gov.turkiye.edevlet.kapisi"), "edevlet" to listOf("tr.gov.turkiye.edevlet.kapisi"),
                  "minecraft" to listOf("com.mojang.minecraftpe"), "roblox" to listOf("com.roblox.client"), "pubg" to listOf("com.tencent.ig"),
                  "zoom" to listOf("us.zoom.videomeet"), "teams" to listOf("com.microsoft.teams"), "outlook" to listOf("com.microsoft.office.outlook"),
                  "linkedin" to listOf("com.linkedin.android"), "pinterest" to listOf("com.pinterest"), "reddit" to listOf("com.reddit.frontpage")
              )

              @Synchronized fun all(): List<App> {
                  val now = System.currentTimeMillis()
                  if (cache.isNotEmpty() && now - stamp < 120000L) return cache
                  val pm = NovaxApp.instance.packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(i, PackageManager.MATCH_ALL)
                      .map {
                          val lbl = it.loadLabel(pm).toString()
                          App(lbl, it.activityInfo.packageName, Text.norm(lbl))
                      }
                      .distinctBy { it.pkg }
                      .sortedBy { it.norm }
                  cache = list
                  stamp = now
                  return list
              }

              fun find(spoken: String): App? {
                  val apps = all()
                  val stems = Text.stems(spoken).map { it.removeSuffix(" uygulamasi").removeSuffix(" uygulamasini").trim() }.filter { it.isNotEmpty() }
                  for (cand in stems) {
                      val pk = alias[cand]
                      if (pk != null) {
                          for (p in pk) {
                              val hit = apps.firstOrNull { it.pkg == p || it.pkg.startsWith(p + ".") }
                              if (hit != null) return hit
                          }
                      }
                  }
                  var best: App? = null
                  var bestScore = 0
                  for (cand in stems) {
                      for (a in apps) {
                          var s = 0
                          if (a.norm == cand) s = 100
                          else if (a.norm.startsWith(cand) && cand.length >= 3) s = 80 - minOf(15, a.norm.length - cand.length)
                          else if (cand.length >= 4 && a.norm.contains(cand)) s = 60
                          else if (a.norm.length >= 4 && cand.contains(a.norm)) s = 50
                          else if (cand.length >= 5 && Text.lev(a.norm, cand) <= maxOf(1, cand.length / 5)) s = 40
                          if (s > bestScore) { bestScore = s; best = a }
                      }
                  }
                  return best
              }

              fun listText(filter: String): String {
                  val n = Text.norm(filter)
                  val l = all().filter { n.isEmpty() || it.norm.contains(n) }
                  return if (l.isEmpty()) "Eşleşen uygulama yok." else l.take(60).joinToString(", ") { it.label }
              }
          }
          NOVAX_EOF

