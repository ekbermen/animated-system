      - name: Yaz app/src/main/java/com/novax/assistant/AccessibilityFastExtensions.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/AccessibilityFastExtensions.kt <<'NOVAX_EOF'
          package com.novax.assistant
          
          import android.graphics.Bitmap
          import android.graphics.Rect
          import android.os.Build
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.io.ByteArrayOutputStream
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          
          /**
           * Erişilebilirlik servisine ek hızlı işlemler.
           *
           * Kotlin extension kullanmak yerine ayrı object kullanıldı; mevcut servis dosyasını
           * büyütmeden yeni özellikleri bağımsız test etmek kolaylaşır.
           */
          object AccessibilityFastExtensions {
          
              fun screenText(): String {
                  val s = NovaxAccessibilityService.instance ?: return "Erişilebilirlik kapalı."
                  val nodes = s.findAll("", false)
                  return nodes.take(120).joinToString(" | ") {
                      it.text?.toString().orEmpty().ifBlank { it.contentDescription?.toString().orEmpty() }
                  }.take(12000)
              }
          
              fun clickFast(query: String): Boolean {
                  val s = NovaxAccessibilityService.instance ?: return false
                  val exact = s.findAll(query, true).firstOrNull()
                  if (exact != null && s.clickNode(exact)) return true
                  val near = s.findAll(query, false).firstOrNull()
                  return near != null && s.clickNode(near)
              }
          
              fun swipeFast(direction: String): Boolean {
                  val s = NovaxAccessibilityService.instance ?: return false
                  return s.scroll(direction)
              }
          
              fun typeFast(text: String): Boolean {
                  val s = NovaxAccessibilityService.instance ?: return false
                  return s.typeText(text)
              }
          
              fun screenshot(): ByteArray? {
                  val s = NovaxAccessibilityService.instance ?: return null
                  return s.takeScreenshotBytes()
              }
          
              fun sendKey(code: Int): Boolean {
                  val s = NovaxAccessibilityService.instance ?: return false
                  return s.pressKey(code)
              }
          
              fun findButtons(limit: Int = 80): List<String> {
                  val s = NovaxAccessibilityService.instance ?: return emptyList()
                  val result = ArrayList<String>()
                  for (root in s.roots()) {
                      walk(root, 0, 35, result, limit)
                      if (result.size >= limit) break
                  }
                  return result.distinct().take(limit)
              }
          
              private fun walk(n: AccessibilityNodeInfo?, depth: Int, maxDepth: Int, out: MutableList<String>, limit: Int) {
                  if (n == null || depth > maxDepth || out.size >= limit) return
                  if (n.isVisibleToUser && n.isClickable) {
                      val a = n.text?.toString().orEmpty().trim()
                      val d = n.contentDescription?.toString().orEmpty().trim()
                      val value = if (a.isNotBlank()) a else d
                      if (value.isNotBlank()) out.add(value)
                  }
                  for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1, maxDepth, out, limit)
              }
          }
          
          /**
           * Ekran görüntüsünü üretir. Android 11+ AccessibilityService.takeScreenshot API'si
           * mevcutsa onu kullanır; daha eski cihazlarda güvenli fallback olarak null döner.
           */
          object ScreenCapture {
          
              fun captureNow(): String {
                  val s = NovaxAccessibilityService.instance
                      ?: return "Ekran görüntüsü için erişilebilirlik servisini aç."
          
                  val bytes = s.takeScreenshotBytes()
                  if (bytes == null) {
                      ActionAudit.log("SCREENSHOT_FAIL", "bytes=null")
                      return "Ekran görüntüsü alınamadı."
                  }
          
                  val dir = java.io.File(NovaxApp.instance.cacheDir, "screenshots")
                  if (!dir.exists()) dir.mkdirs()
                  val name = "novax_${System.currentTimeMillis()}.jpg"
                  val f = java.io.File(dir, name)
                  return try {
                      f.writeBytes(bytes)
                      ActionAudit.log("SCREENSHOT_OK", f.absolutePath)
                      "Ekran görüntüsü alındı ve Novax önbelleğine kaydedildi."
                  } catch (e: Exception) {
                      "Ekran görüntüsü kaydedilemedi: ${e.message}"
                  }
              }
          }
          
          /*
           * Ekran kontrolü için güvenli gecikme değerleri.
           * Çok hızlı döngüler WhatsApp ve diğer uygulamalarda UI'nin henüz güncellenmemesine
           * yol açabildiğinden, doğrulama noktalarında kısa ama gerçekçi beklemeler kullanılır.
           */
          object AccessibilityTiming {
              const val CLICK_SETTLE_MS = 180L
              const val SCREEN_SETTLE_MS = 240L
              const val APP_LAUNCH_SETTLE_MS = 600L
              const val RETRY_MS = 320L
              const val MAX_RETRIES = 3
          
              fun waitForUi(ms: Long = SCREEN_SETTLE_MS) {
                  try { Thread.sleep(ms.coerceIn(40L, 2000L)) } catch (_: InterruptedException) {}
              }
          }
