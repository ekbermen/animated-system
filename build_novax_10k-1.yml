              }

              private fun JSONObject.str(k: String): String = optString(k, "").trim()

              fun execute(name: String, a: JSONObject): String {
                  Bus.log("▸ $name")
                  return when (name) {
                      "open_app" -> Act.openApp(a.str("name"))
                      "list_apps" -> Apps.listText(a.str("filter"))
                      "open_url" -> Act.openUrl(a.str("url"))
                      "web_search" -> Gemini.search(a.str("query"))
                      "fetch_url" -> Web.fetchText(a.str("url"))
                      "play_youtube" -> Act.playYoutube(a.str("query"))
                      "navigate" -> Act.navigate(a.str("destination"))
                      "find_contact" -> Messaging.findContactText(a.str("name"))
                      "call_phone" -> Messaging.call(a.str("to"))
                      "send_sms" -> Messaging.sms(a.str("to"), a.str("text"))
                      "send_whatsapp" -> Messaging.whatsapp(a.str("to"), a.str("text"))
                      "set_alarm" -> Act.setAlarm(a.optInt("hour"), a.optInt("minute"), a.str("label"))
                      "set_timer" -> Act.setTimer(a.optInt("seconds"), a.str("label"))
                      "flashlight" -> Act.flashlight(a.optBoolean("on", true))
                      "set_volume" -> Act.setVolume(a.optInt("level", 50), a.str("stream"))
                      "set_brightness" -> Act.setBrightness(a.optInt("level", 50))
                      "media_control" -> Act.media(a.str("action"))
                      "quick_toggle" -> Act.quickToggle(a.str("name"), if (a.has("on")) a.optBoolean("on") else null)
                      "open_settings" -> Act.openSettings(a.str("page"))
                      "battery" -> Act.battery()
                      "time_now" -> Act.timeNow()
                      "copy_to_clipboard" -> Act.copy(a.str("text"))
                      "share_text" -> Act.share(a.str("text"))
                      "take_photo" -> Act.takePhoto(a.optBoolean("front", false))
                      "screen_read" -> Screen.read()
                      "screen_describe" -> Screen.describe(a.str("question").ifBlank { "Ekranda ne var?" })
                      "tap_text" -> Screen.tapText(a.str("text"), a.optBoolean("exact", false))
                      "tap_xy" -> Screen.tapXY(a.optDouble("x").toFloat(), a.optDouble("y").toFloat())
                      "swipe" -> Screen.swipe(a.str("direction"))
                      "type_text" -> Screen.type(a.str("text"), a.optBoolean("append", false), a.optBoolean("enter", false))
                      "press_key" -> Screen.key(a.str("key"))
                      "take_screenshot" -> Screen.screenshotToFile()
                      "wait" -> {
                          Thread.sleep(a.optLong("ms", 1000L).coerceIn(0L, 15000L))
                          "bekledim"
                      }
                      "wait_for_text" -> Screen.waitFor(a.str("text"), a.optInt("timeout_s", 8))
                      "remember" -> {
                          MemoryStore.remember(a.str("key"), a.str("value"))
                          "Kaydedildi."
                      }
                      "recall" -> recallText(a.str("query"))
                      "forget" -> MemoryStore.forget(a.str("key")).toString() + " kayıt silindi."
                      "create_note" -> Act.createNote(a.str("title"), a.str("content"))
                      "list_notes" -> MemoryStore.notes().joinToString("\n").ifBlank { "Not yok." }
                      "background_task" -> Brain.background(a.str("goal"))
                      else -> "HATA: bilinmeyen araç $name"
                  }
              }

              private fun recallText(q: String): String {
                  val r = MemoryStore.recall(q)
                  return if (r.isEmpty()) "Kayıt bulunamadı." else r.joinToString("\n") { it.first + ": " + it.second }
              }
          }
