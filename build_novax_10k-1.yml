        run: |
          cat > app/src/main/java/com/novax/assistant/HudBackgroundView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.view.View
          import java.util.Random
          import kotlin.math.sin

          /** Koyu mavi HUD zemin: ızgara, tarama çizgisi, köşe parantezleri ve süzülen parçacıklar. */
          class HudBackgroundView(ctx: Context) : View(ctx) {
              private val dn = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = Random(7)
              private val count = 42
              private val px = FloatArray(count) { rnd.nextFloat() }
              private val py = FloatArray(count) { rnd.nextFloat() }
              private val ps = FloatArray(count) { 0.01f + rnd.nextFloat() * 0.04f }
              private val pr = FloatArray(count) { 0.8f + rnd.nextFloat() * 1.8f }
              private var t = 0f
              private var last = 0L
              private var bgShader: LinearGradient? = null

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  bgShader = LinearGradient(0f, 0f, 0f, h.toFloat(), intArrayOf(0xFF010409.toInt(), 0xFF03111E.toInt(), 0xFF020A12.toInt()), null, Shader.TileMode.CLAMP)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now
                  t += dt

                  p.reset()
                  p.isAntiAlias = true
                  p.shader = bgShader
                  c.drawRect(0f, 0f, w, h, p)
                  p.shader = null

                  // ızgara
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 1f
                  p.color = 0x1200E5FF
                  val step = 38f * dn
                  var x = 0f
                  while (x < w) { c.drawLine(x, 0f, x, h, p); x += step }
                  var y = (t * 6f * dn) % step
                  while (y < h) { c.drawLine(0f, y, w, y, p); y += step }

                  // tarama çizgisi
                  val sy = ((t * 0.12f) % 1f) * h
                  p.shader = LinearGradient(0f, sy - 60f * dn, 0f, sy, intArrayOf(0, 0x2800E5FF), null, Shader.TileMode.CLAMP)
                  p.style = Paint.Style.FILL
                  c.drawRect(0f, sy - 60f * dn, w, sy, p)
                  p.shader = null

                  // parçacıklar
                  p.style = Paint.Style.FILL
                  for (i in 0 until count) {
                      py[i] -= ps[i] * dt
                      if (py[i] < 0f) { py[i] = 1f; px[i] = rnd.nextFloat() }
                      val a = (0.25f + 0.25f * sin(t * 2f + i)).coerceIn(0f, 1f)
                      p.color = ((a * 255).toInt() shl 24) or 0x0000E5FF
                      c.drawCircle(px[i] * w, py[i] * h, pr[i] * dn, p)
                  }

                  // köşe parantezleri
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * dn
                  p.color = 0xAA00E5FF.toInt()
                  val m = 10f * dn
                  val l = 26f * dn
                  c.drawLine(m, m, m + l, m, p); c.drawLine(m, m, m, m + l, p)
                  c.drawLine(w - m, m, w - m - l, m, p); c.drawLine(w - m, m, w - m, m + l, p)
                  c.drawLine(m, h - m, m + l, h - m, p); c.drawLine(m, h - m, m, h - m - l, p)
                  c.drawLine(w - m, h - m, w - m - l, h - m, p); c.drawLine(w - m, h - m, w - m, h - m - l, p)

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

