                  }
              }

              // ------------------------------------------------------------------ yardımcılar
              private fun sendMsg(rest: String, whole: String): String? {
                  if (!Contacts.granted()) return null
                  val split = Messaging.splitNameText(rest) ?: return null
                  val c = split.first
                  val text = split.second
                  val useSms = Regex("(?i)\\bsms\\b").containsMatchIn(whole)
                  val dest = c.name.ifBlank { c.number }
                  return if (useSms) Messaging.sms(dest, text) else Messaging.whatsapp(dest, text)
              }

              private fun callIfContact(name: String): String? {
                  if (!Contacts.granted()) return null
                  if (Contacts.find(name) == null) return null
                  return Messaging.call(name)
              }
          }

          /** Basit özyinelemeli ifade çözücü: artı, eksi, çarpı, bölü ve parantez. Türkçe kelimeleri (artı, eksi, çarpı, bölü) tanır. */
          object Calc {
              fun tryEval(raw: String): Double? {
                  var s = raw.lowercase()
                      .replace("artı", "+").replace("arti", "+").replace("eksi", "-")
                      .replace("çarpı", "*").replace("carpi", "*").replace("kere", "*").replace("×", "*")
                      .replace("bölü", "/").replace("bolu", "/").replace("÷", "/").replace(",", ".")
                  s = s.replace(Regex("(?<=\\d)\\s*x\\s*(?=\\d)"), "*")
                  if (!s.any { it.isDigit() }) return null
                  if (s.any { !(it.isDigit() || it in "+-*/(). ") }) return null
                  if (!s.any { it in "+-*/" }) return null
                  return try {
                      val p = Parser(s.replace(" ", ""))
                      val v = p.expr()
                      if (p.done() && !v.isNaN() && !v.isInfinite()) v else null
                  } catch (_: Exception) {
                      null
                  }
              }

              private class Parser(val s: String) {
                  var i = 0
                  fun done(): Boolean = i >= s.length
                  fun expr(): Double {
                      var v = term()
                      while (i < s.length && (s[i] == '+' || s[i] == '-')) {
                          val op = s[i++]
                          val t = term()
                          v = if (op == '+') v + t else v - t
                      }
                      return v
                  }
                  fun term(): Double {
                      var v = factor()
                      while (i < s.length && (s[i] == '*' || s[i] == '/')) {
                          val op = s[i++]
                          val f = factor()
                          v = if (op == '*') v * f else v / f
                      }
                      return v
                  }
                  fun factor(): Double {
                      if (i < s.length && s[i] == '-') {
                          i++
                          return -factor()
                      }
                      if (i < s.length && s[i] == '(') {
                          i++
                          val v = expr()
                          if (i < s.length && s[i] == ')') i++ else throw IllegalStateException("paren")
                          return v
                      }
                      val st = i
                      while (i < s.length && (s[i].isDigit() || s[i] == '.')) i++
                      if (st == i) throw IllegalStateException("num")
                      return s.substring(st, i).toDouble()
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Contacts.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Contacts.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.ContactsContract

          /** Rehber erişimi + Türkçe çekim eklerine dayanıklı isim çözümleme ("annemi", "babama"...). */
          object Contacts {
              data class C(val name: String, val number: String, val norm: String)

              private var cache: List<C> = emptyList()
              private var stamp = 0L

              fun granted(): Boolean =
                  NovaxApp.instance.checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED

              @Synchronized fun all(): List<C> {
                  if (!granted()) return emptyList()
                  val now = System.currentTimeMillis()
                  if (cache.isNotEmpty() && now - stamp < 60000L) return cache
                  val out = ArrayList<C>()
                  val seen = HashSet<String>()
                  val cols = arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER)
                  val cur = NovaxApp.instance.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI, cols, null, null, null
                  )
                  if (cur != null) {
                      try {
                          while (cur.moveToNext()) {
                              val name = cur.getString(0)
                              val num = cur.getString(1)
                              if (name == null || num == null) continue
                              val key = name + "|" + num.filter { it.isDigit() }
                              if (seen.add(key)) out.add(C(name, num, Text.norm(name)))
                          }
                      } finally {
                          cur.close()
                      }
                  }
                  cache = out
                  stamp = now
                  return out
              }

              fun invalidate() { stamp = 0L }

              /** Konuşulan adı rehberdeki kişiyle eşler; numara verilmişse doğrudan numara döner. */
              fun find(spoken: String): C? {
                  val s = spoken.trim()
                  val digits = s.filter { it.isDigit() || it == '+' }
                  if (digits.count { it.isDigit() } >= 7 && s.count { it.isLetter() } == 0) return C("", digits, "")
                  val list = all()
                  if (list.isEmpty()) return null
                  val stems = Text.stems(s)
                  for (cand in stems) {
                      val exact = list.firstOrNull { it.norm == cand }
                      if (exact != null) return exact
                      if (cand.length >= 3) {
                          val word = list.firstOrNull { n -> n.norm.split(" ").any { it == cand } }
                          if (word != null) return word
                      }
                  }
                  for (cand in stems) {
                      if (cand.length >= 4) {
                          val pre = list.filter { it.norm.startsWith(cand) }.minByOrNull { it.norm.length }
                          if (pre != null) return pre
                      }
                  }
                  for (cand in stems) {
                      if (cand.length >= 5) {
                          val fz = list.firstOrNull { n ->
                              val first = n.norm.substringBefore(' ')
                              Text.lev(first, cand) <= 1 || Text.lev(n.norm, cand) <= 1
                          }
                          if (fz != null) return fz
                      }
                  }
                  return null
              }

              fun search(q: String, limit: Int = 8): List<C> {
                  val n = Text.norm(q)
                  return all().filter { it.norm.contains(n) }.take(limit)
              }

              /** Telefon numarasını wa.me için sadece rakam ve ülke kodlu hale getirir. */
              fun intl(raw: String): String {
                  var d = raw.filter { it.isDigit() }
                  if (raw.trim().startsWith("+")) return d
                  if (d.startsWith("00")) return d.substring(2)
                  val cc = Prefs.countryCode
                  if (d.startsWith("0")) d = cc + d.substring(1)
                  else if (d.length <= 10 && !d.startsWith(cc)) d = cc + d
                  return d
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Gemini.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Gemini.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.os.Build
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Gemini REST istemcisi: araç çağırma döngüsü, Google Arama (grounding) ve görüntü anlama. */
          object Gemini {
              private const val BASE = "https://generativelanguage.googleapis.com/v1beta/models/"
              private const val MAX_STEPS = 14

              class GeminiException(msg: String) : IOException(msg)

              private fun post(model: String, body: JSONObject, timeoutMs: Int = 70000): JSONObject {
                  val key = Prefs.geminiKey
                  if (key.isBlank()) throw GeminiException("Gemini API anahtarı yok. Ayarlar'dan ekle.")
                  val c = URL(BASE + model + ":generateContent").openConnection() as HttpURLConnection
                  try {
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = timeoutMs
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      c.setRequestProperty("x-goog-api-key", key)
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val txt = if (stream != null) stream.bufferedReader(Charsets.UTF_8).use { it.readText() } else ""
                      if (code !in 200..299) throw GeminiException("Gemini $code: " + errorMessage(txt))
                      return JSONObject(txt)
                  } finally {
                      c.disconnect()
                  }
              }

              private fun errorMessage(txt: String): String {
                  return try {
                      JSONObject(txt).getJSONObject("error").optString("message", txt).take(300)
                  } catch (_: Exception) {
                      txt.take(300)
                  }
              }

              private fun textContent(role: String, text: String): JSONObject =
                  JSONObject().put("role", role).put("parts", JSONArray().put(JSONObject().put("text", text)))

              private fun system(text: String): JSONObject =
                  JSONObject().put("parts", JSONArray().put(JSONObject().put("text", text)))

              // ------------------------------------------------------------------ sistem istemi
              fun systemPrompt(): String {
                  val now = SimpleDateFormat("EEEE, d MMMM yyyy HH:mm", Locale("tr")).format(Date())
                  val name = Prefs.userName.ifBlank { "kullanıcı" }
                  val facts = MemoryStore.factsBlock()
                  val acc = if (NovaxAccessibilityService.connected) "AÇIK (ekran kontrolü mümkün)" else "KAPALI (ekran araçları çalışmaz, kullanıcıdan açmasını iste)"
                  val factsText = if (facts.isBlank()) "- (henüz kayıt yok)" else facts
                  val sb = StringBuilder()
                  sb.append("Sen NOVAX'sın: ").append(name).append("'in Android telefonunda çalışan, J.A.R.V.I.S. tarzı sesli yapay zekâ asistanı.\n")
                  sb.append("Şu an: ").append(now).append(". Cihaz: ").append(Build.MANUFACTURER).append(' ').append(Build.MODEL)
                  sb.append(", Android ").append(Build.VERSION.RELEASE).append(". Erişilebilirlik servisi: ").append(acc).append(".\n\n")
                  sb.append("DAVRANIŞ\n")
                  sb.append("- Kullanıcının dilinde konuş (varsayılan Türkçe). Cevaplar sesli okunacak: kısa, doğal, markdown/emoji/liste yok.\n")
                  sb.append("- Bir işi yapmak için ARAÇLARI kullan; yapmadan yaptım deme. Bitince tek cümleyle sonucu söyle.\n")
                  sb.append("- Ekranda çok adımlı iş yaparken: önce uygulamayı aç, sonra screen_read ile ekranı oku, sonra tap_text/type_text ile ilerle, her adımdan sonra screen_read ile doğrula. Takılırsan farklı yol dene; 3 başarısız denemeden sonra durumu açıkla.\n")
                  sb.append("- Güncel bilgi (hava, haber, skor, fiyat) için web_search kullan. Uydurma.\n")
                  sb.append("- Kullanıcıyla ilgili kalıcı bilgiyi (isim, tercih, kişi ilişkisi, şifre ipucu değil) remember ile kaydet. Gerekirse recall ile ara.\n")
                  sb.append("- Uzun süren bağımsız işleri background_task ile arka plana at ve kullanıcıya hemen haber ver.\n")
                  sb.append("- Geri alınamaz/riskli işlemlerden önce (para gönderme, satın alma, silme, hesap kapatma, toplu mesaj) mutlaka kullanıcıdan sesli onay iste.\n")
                  sb.append("- Şifre, kart numarası gibi hassas veri girmeden önce kullanıcıya sor. Başkasının gizliliğini ihlal edecek şeyler yapma.\n\n")
                  sb.append("HAFIZA (kullanıcı hakkında bilinenler)\n")
                  sb.append(factsText)
                  return sb.toString()
              }

              // ------------------------------------------------------------------ ana sohbet + araç döngüsü
              fun converse(userText: String, history: List<Pair<String, String>>, onStep: (String) -> Unit): String {
                  val contents = JSONArray()
                  for (h in history) {
                      contents.put(textContent(if (h.first == "user") "user" else "model", h.second))
                  }
                  contents.put(textContent("user", userText))
                  return loop(contents, onStep)
              }

              private fun loop(contents: JSONArray, onStep: (String) -> Unit): String {
                  val tools = JSONArray().put(JSONObject().put("functionDeclarations", Tools.declarations()))
                  var lastText = ""
                  for (step in 0 until MAX_STEPS) {
                      val body = JSONObject()
                          .put("contents", contents)
                          .put("systemInstruction", system(systemPrompt()))
                          .put("tools", tools)
                          .put("generationConfig", JSONObject().put("temperature", 0.6))
                      val resp = post(Prefs.model, body)
                      val cand = resp.optJSONArray("candidates")?.optJSONObject(0)
                      if (cand == null) {
                          val why = resp.optJSONObject("promptFeedback")?.optString("blockReason") ?: ""
                          return if (why.isNotBlank()) "İstek reddedildi: $why" else "Cevap alamadım."
                      }
                      val content = cand.optJSONObject("content")
                      val parts = content?.optJSONArray("parts") ?: JSONArray()
                      if (parts.length() == 0) return lastText.ifBlank { "Boş cevap geldi (" + cand.optString("finishReason") + ")." }

                      // Modelin turunu olduğu gibi geri ekle (thoughtSignature korunur).
                      contents.put(JSONObject().put("role", "model").put("parts", parts))

                      val calls = ArrayList<JSONObject>()
                      val sb = StringBuilder()
                      for (i in 0 until parts.length()) {
                          val p = parts.getJSONObject(i)
                          val fc = p.optJSONObject("functionCall")
                          if (fc != null) calls.add(fc)
                          if (p.has("text") && !p.optBoolean("thought", false)) sb.append(p.getString("text"))
                      }
                      if (sb.isNotBlank()) lastText = sb.toString().trim()
                      if (calls.isEmpty()) return lastText.ifBlank { "Tamam." }

                      val results = JSONArray()
                      for (call in calls) {
                          val fname = call.optString("name")
                          val args = call.optJSONObject("args") ?: JSONObject()
                          onStep(fname + " " + Text.clip(args.toString(), 90))
                          val out = try {
                              Tools.execute(fname, args)
                          } catch (e: Exception) {
                              "HATA: " + e.javaClass.simpleName + ": " + e.message
                          }
                          results.put(
                              JSONObject().put(
                                  "functionResponse",
                                  JSONObject().put("name", fname).put("response", JSONObject().put("result", Text.clip(out, 6000)))
                              )
                          )
                      }
                      contents.put(JSONObject().put("role", "user").put("parts", results))
                  }
                  return lastText.ifBlank { "Çok fazla adım gerekti, işi yarıda bıraktım." }
              }

              // ------------------------------------------------------------------ Google Arama (grounding)
              fun search(query: String): String {
                  val body = JSONObject()
                      .put("contents", JSONArray().put(textContent("user", query)))
                      .put("systemInstruction", system("Türkçe, kısa ve doğru cevap ver. Güncel bilgiyi aramadan al. Markdown kullanma. En fazla 5 cümle."))
                      .put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                  val resp = post(Prefs.model, body)
                  val parts = resp.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                      ?: return "Sonuç bulunamadı."
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  return sb.toString().trim().ifBlank { "Sonuç bulunamadı." }
              }

              // ------------------------------------------------------------------ görüntü anlama
              fun describeImage(jpegBase64: String, question: String): String {
                  val parts = JSONArray()
                      .put(JSONObject().put("text", question))
                      .put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", jpegBase64)))
                  val body = JSONObject()
                      .put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", parts)))
                      .put("systemInstruction", system("Bu bir Android ekran görüntüsü. Türkçe, kısa ve net cevap ver. Düğme ve metinleri adlarıyla an."))
                  val resp = post(Prefs.model, body, 90000)
                  val out = resp.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                      ?: return "Görüntü yorumlanamadı."
                  val sb = StringBuilder()
                  for (i in 0 until out.length()) sb.append(out.getJSONObject(i).optString("text"))
                  return sb.toString().trim()
              }

              /** Anahtar testi: küçük bir istek atar. */
              fun test(): String {
                  return try {
                      val body = JSONObject().put("contents", JSONArray().put(textContent("user", "Sadece 'tamam' yaz.")))
                      val r = post(Prefs.model, body, 20000)
                      val t = r.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")
                          ?.optJSONArray("parts")?.optJSONObject(0)?.optString("text") ?: "?"
                      "Bağlantı tamam: " + t.trim()
                  } catch (e: Exception) {
                      "Hata: " + e.message
                  }
              }
          }
          NOVAX_EOF

