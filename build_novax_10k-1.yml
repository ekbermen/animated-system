                      }
                  }
          
                  return "Ekranda sesli mesajın oynatma düğmesini bulamadım."
              }
          
              fun analyzeCurrentScreen(question: String): String {
                  val s = NovaxAccessibilityService.instance
                      ?: return "Görüntüyü analiz etmek için erişilebilirlik servisini aç."
                  val bytes = s.takeScreenshotBytes()
                      ?: return "Ekran görüntüsü alınamadı."
                  return try {
