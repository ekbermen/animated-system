                      result
                  } catch (e: Exception) {
                      "Görüntü analiz hatası: ${e.message}"
                  }
              }
          
              fun synthesizeVoice(text: String): Boolean {
                  if (text.isBlank()) return false
                  if (!preparing.compareAndSet(false, true)) return false
                  return try {
                      // Voice.speak kullanıcıya ses verir. WhatsApp'a gerçek voice note eklemek,
                      // üçüncü taraf uygulamanın kendi kayıt UI'sını gerektirir. Bu yüzden sahte
                      // bir "gönderildi" sonucu üretilmez.
                      Voice.speak(text)
                      ActionAudit.log("VOICE_PREPARE", "TTS ile mesaj hazırlandı: ${text.take(160)}")
                      true
                  } catch (_: Exception) {
                      false
                  } finally {
                      preparing.set(false)
                  }
              }
          
              fun openMedia(uri: Uri): Boolean {
                  return try {
                      val i = Intent(Intent.ACTION_VIEW, uri)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      NovaxApp.instance.startActivity(i)
                      ActionAudit.log("MEDIA_OPEN", uri.toString())
                      true
                  } catch (_: Exception) {
                      false
                  }
              }
          
              fun shareText(text: String, targetPackage: String? = null): Boolean {
                  val i = Intent(Intent.ACTION_SEND)
                      .setType("text/plain")
                      .putExtra(Intent.EXTRA_TEXT, text)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (!targetPackage.isNullOrBlank()) i.setPackage(targetPackage)
                  return try {
                      NovaxApp.instance.startActivity(i)
                      ActionAudit.log("SHARE_TEXT", text.take(200))
                      true
                  } catch (_: Exception) {
                      false
                  }
              }
          }
          
          /**
           * Medya yetkileri için tek kontrol noktası.
           */
          object MediaPermissions {
              fun needed(): Array<String> {
                  val out = ArrayList<String>()
                  if (Build.VERSION.SDK_INT >= 33) {
                      out.add(android.Manifest.permission.READ_MEDIA_IMAGES)
                      out.add(android.Manifest.permission.READ_MEDIA_VIDEO)
                      out.add(android.Manifest.permission.READ_MEDIA_AUDIO)
                  }
                  return out.toTypedArray()
              }
          
              fun hasAll(c: Context): Boolean =
                  needed().all { c.checkSelfPermission(it) == android.content.pm.PackageManager.PERMISSION_GRANTED }
          }
          
          /*
           * Medya davranış matrisi:
           *  - Fotoğraf: ACTION_VIEW / paylaşım / ekran analizi.
           *  - Video: kullanıcı seçimi veya ekran analizi.
           *  - Ses: görünür oynatıcı veya paylaşım.
